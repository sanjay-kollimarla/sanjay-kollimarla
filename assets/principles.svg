<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#060914"/><stop offset=".5" stop-color="#0d1330"/><stop offset="1" stop-color="#1a0b2e"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset="1" stop-color="#fff" stop-opacity=".03"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#c4b5fd" stop-opacity=".4"/>
  </linearGradient>
  <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
    <stop offset="0" stop-color="#67e8f9"/><stop offset=".35" stop-color="#a78bfa"/><stop offset=".7" stop-color="#f0abfc"/><stop offset="1" stop-color="#67e8f9"/>
    <animate attributeName="x1" values="0;-1;0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="1;0;1" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
  </linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".45"/></filter>
</defs><rect width="1000" height="300" rx="26" fill="url(#bg)"/>
<g filter="url(#blur)" opacity=".55">
  <circle r="126" fill="#22d3ee" cx="150" cy="90"><animate attributeName="cx" values="100;350;100" dur="11s" repeatCount="indefinite"/><animate attributeName="cy" values="60;240;60" dur="9s" repeatCount="indefinite"/></circle>
  <circle r="150" fill="#7c3aed" cx="550" cy="210"><animate attributeName="cx" values="450;700;450" dur="13s" repeatCount="indefinite"/><animate attributeName="cy" values="240;60;240" dur="10s" repeatCount="indefinite"/></circle>
  <circle r="120" fill="#db2777" cx="880" cy="105"><animate attributeName="cx" values="950;650;950" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="90;270;90" dur="8s" repeatCount="indefinite"/></circle>
</g><circle cx="570" cy="70" r="2.1" fill="#fff"><animate attributeName="opacity" values="0;.9;0" dur="6.4s" begin="1.3s" repeatCount="indefinite"/><animate attributeName="cy" values="70;46;70" dur="6.4s" repeatCount="indefinite"/></circle><circle cx="633" cy="41" r="1.9" fill="#fff"><animate attributeName="opacity" values="0;.9;0" dur="4.0s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="cy" values="41;17;41" dur="4.0s" repeatCount="indefinite"/></circle><circle cx="452" cy="244" r="2.2" fill="#fff"><animate attributeName="opacity" values="0;.9;0" dur="4.5s" begin="3.6s" repeatCount="indefinite"/><animate attributeName="cy" values="244;220;244" dur="4.5s" repeatCount="indefinite"/></circle><circle cx="844" cy="167" r="2.4" fill="#fff"><animate attributeName="opacity" values="0;.9;0" dur="7.5s" begin="2.6s" repeatCount="indefinite"/><animate attributeName="cy" values="167;143;167" dur="7.5s" repeatCount="indefinite"/></circle><circle cx="147" cy="125" r="2.6" fill="#fff"><animate attributeName="opacity" values="0;.9;0" dur="3.7s" begin="3.1s" repeatCount="indefinite"/><animate attributeName="cy" values="125;101;125" dur="3.7s" repeatCount="indefinite"/></circle><circle cx="993" cy="83" r="1.6" fill="#fff"><animate attributeName="opacity" values="0;.9;0" dur="3.4s" begin="3.8s" repeatCount="indefinite"/><animate attributeName="cy" values="83;59;83" dur="3.4s" repeatCount="indefinite"/></circle><circle cx="755" cy="198" r="1.9" fill="#fff"><animate attributeName="opacity" values="0;.9;0" dur="4.0s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="cy" values="198;174;198" dur="4.0s" repeatCount="indefinite"/></circle><circle cx="659" cy="49" r="2.6" fill="#fff"><animate attributeName="opacity" values="0;.9;0" dur="5.5s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="cy" values="49;25;49" dur="5.5s" repeatCount="indefinite"/></circle><circle cx="559" cy="171" r="1.4" fill="#fff"><animate attributeName="opacity" values="0;.9;0" dur="4.5s" begin="1.1s" repeatCount="indefinite"/><animate attributeName="cy" values="171;147;171" dur="4.5s" repeatCount="indefinite"/></circle><circle cx="385" cy="186" r="0.8" fill="#fff"><animate attributeName="opacity" values="0;.9;0" dur="6.1s" begin="3.8s" repeatCount="indefinite"/><animate attributeName="cy" values="186;162;186" dur="6.1s" repeatCount="indefinite"/></circle><circle cx="251" cy="140" r="2.0" fill="#fff"><animate attributeName="opacity" values="0;.9;0" dur="4.8s" begin="1.3s" repeatCount="indefinite"/><animate attributeName="cy" values="140;116;140" dur="4.8s" repeatCount="indefinite"/></circle><circle cx="234" cy="233" r="2.0" fill="#fff"><animate attributeName="opacity" values="0;.9;0" dur="3.2s" begin="3.6s" repeatCount="indefinite"/><animate attributeName="cy" values="233;209;233" dur="3.2s" repeatCount="indefinite"/></circle><circle cx="819" cy="156" r="1.1" fill="#fff"><animate attributeName="opacity" values="0;.9;0" dur="4.3s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="cy" values="156;132;156" dur="4.3s" repeatCount="indefinite"/></circle><circle cx="8" cy="121" r="1.0" fill="#fff"><animate attributeName="opacity" values="0;.9;0" dur="7.0s" begin="2.6s" repeatCount="indefinite"/><animate attributeName="cy" values="121;97;121" dur="7.0s" repeatCount="indefinite"/></circle><circle cx="102" cy="295" r="1.6" fill="#fff"><animate attributeName="opacity" values="0;.9;0" dur="5.0s" begin="3.9s" repeatCount="indefinite"/><animate attributeName="cy" values="295;271;295" dur="5.0s" repeatCount="indefinite"/></circle><circle cx="139" cy="135" r="1.1" fill="#fff"><animate attributeName="opacity" values="0;.9;0" dur="4.1s" begin="2.6s" repeatCount="indefinite"/><animate attributeName="cy" values="135;111;135" dur="4.1s" repeatCount="indefinite"/></circle><circle cx="13" cy="19" r="1.6" fill="#fff"><animate attributeName="opacity" values="0;.9;0" dur="7.5s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="cy" values="19;-5;19" dur="7.5s" repeatCount="indefinite"/></circle><circle cx="244" cy="81" r="2.2" fill="#fff"><animate attributeName="opacity" values="0;.9;0" dur="5.2s" begin="2.1s" repeatCount="indefinite"/><animate attributeName="cy" values="81;57;81" dur="5.2s" repeatCount="indefinite"/></circle><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="4.5s" repeatCount="indefinite"/><rect x="24" y="22" width="300" height="120" rx="22" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.2" filter="url(#shadow)" />
<text x="46" y="60" font-family="'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="22" font-weight="800" fill="#67e8f9">01</text>
<text x="86" y="59" font-size="15" font-weight="800" letter-spacing="2" fill="#f8fafc">CORRECTNESS</text>
<rect x="46" y="72" width="40" height="3" rx="2" fill="#67e8f9"><animate attributeName="width" values="20;256;20" dur="6s" begin="0s" repeatCount="indefinite"/></rect>
<text x="46" y="102" font-size="13" fill="#cbd5e1">Invariants, contracts and edge</text><text x="46" y="121" font-size="13" fill="#cbd5e1">cases before optimizing.</text></g><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="4.9s" repeatCount="indefinite"/><rect x="350" y="22" width="300" height="120" rx="22" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.2" filter="url(#shadow)" />
<text x="372" y="60" font-family="'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="22" font-weight="800" fill="#a78bfa">02</text>
<text x="412" y="59" font-size="15" font-weight="800" letter-spacing="2" fill="#f8fafc">RESILIENCE</text>
<rect x="372" y="72" width="40" height="3" rx="2" fill="#a78bfa"><animate attributeName="width" values="20;256;20" dur="6s" begin="0.4s" repeatCount="indefinite"/></rect>
<text x="372" y="102" font-size="13" fill="#cbd5e1">Retries, timeouts and partial</text><text x="372" y="121" font-size="13" fill="#cbd5e1">failure are design inputs.</text></g><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="5.3s" repeatCount="indefinite"/><rect x="676" y="22" width="300" height="120" rx="22" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.2" filter="url(#shadow)" />
<text x="698" y="60" font-family="'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="22" font-weight="800" fill="#f0abfc">03</text>
<text x="738" y="59" font-size="15" font-weight="800" letter-spacing="2" fill="#f8fafc">CONCURRENCY</text>
<rect x="698" y="72" width="40" height="3" rx="2" fill="#f0abfc"><animate attributeName="width" values="20;256;20" dur="6s" begin="0.8s" repeatCount="indefinite"/></rect>
<text x="698" y="102" font-size="13" fill="#cbd5e1">Atomic operations, races and</text><text x="698" y="121" font-size="13" fill="#cbd5e1">duplicate execution reasoned out.</text></g><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="5.7s" repeatCount="indefinite"/><rect x="24" y="158" width="300" height="120" rx="22" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.2" filter="url(#shadow)" />
<text x="46" y="196" font-family="'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="22" font-weight="800" fill="#fbbf24">04</text>
<text x="86" y="195" font-size="15" font-weight="800" letter-spacing="2" fill="#f8fafc">PERFORMANCE</text>
<rect x="46" y="208" width="40" height="3" rx="2" fill="#fbbf24"><animate attributeName="width" values="20;256;20" dur="6s" begin="1.2000000000000002s" repeatCount="indefinite"/></rect>
<text x="46" y="238" font-size="13" fill="#cbd5e1">Measure representative workloads,</text><text x="46" y="257" font-size="13" fill="#cbd5e1">then optimize with evidence.</text></g><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="6.1s" repeatCount="indefinite"/><rect x="350" y="158" width="300" height="120" rx="22" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.2" filter="url(#shadow)" />
<text x="372" y="196" font-family="'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="22" font-weight="800" fill="#34d399">05</text>
<text x="412" y="195" font-size="15" font-weight="800" letter-spacing="2" fill="#f8fafc">MAINTAINABILITY</text>
<rect x="372" y="208" width="40" height="3" rx="2" fill="#34d399"><animate attributeName="width" values="20;256;20" dur="6s" begin="1.6s" repeatCount="indefinite"/></rect>
<text x="372" y="238" font-size="13" fill="#cbd5e1">Clear abstractions, explicit</text><text x="372" y="257" font-size="13" fill="#cbd5e1">dependencies, single responsibilities.</text></g><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="6.5s" repeatCount="indefinite"/><rect x="676" y="158" width="300" height="120" rx="22" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.2" filter="url(#shadow)" />
<text x="698" y="196" font-family="'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="22" font-weight="800" fill="#fb7185">06</text>
<text x="738" y="195" font-size="15" font-weight="800" letter-spacing="2" fill="#f8fafc">OBSERVABILITY</text>
<rect x="698" y="208" width="40" height="3" rx="2" fill="#fb7185"><animate attributeName="width" values="20;256;20" dur="6s" begin="2s" repeatCount="indefinite"/></rect>
<text x="698" y="238" font-size="13" fill="#cbd5e1">Structured logs, error context and</text><text x="698" y="257" font-size="13" fill="#cbd5e1">metrics make failure diagnosable.</text></g></svg>