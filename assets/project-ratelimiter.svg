<text x="112" y="62" font-size="24" font-weight="800" fill="#f8fafc">Distributed Rate Limiting Service</text>
<text x="112" y="86" font-size="14" font-style="italic" fill="#cbd5e1">Race-free throttling with atomic Lua scripts on Redis.</text>
