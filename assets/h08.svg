<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="110" viewBox="0 0 1000 110" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#05060a"/><stop offset="1" stop-color="#0a0b14"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".045"/><stop offset="1" stop-color="#fff" stop-opacity=".01"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#a5b4fc" stop-opacity=".22"/>
  </linearGradient>
  <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
    <stop offset="0" stop-color="#e2e8f0"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#e2e8f0"/>
    <animate attributeName="x1" values="0;-1;0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="1;0;1" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#818cf8"/>
  </linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<rect width="1000" height="110" rx="22" fill="url(#bg)"/>
<g filter="url(#blur)" opacity=".15"><circle r="60" fill="#3730a3" cx="120" cy="55"><animate attributeName="cx" values="80;400;80" dur="8s" repeatCount="indefinite"/></circle><circle r="70" fill="#3730a3" cx="800" cy="55"><animate attributeName="cx" values="900;560;900" dur="9s" repeatCount="indefinite"/></circle></g>
<rect x="14" y="14" width="972" height="82" rx="20" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.2" filter="url(#shadow)" />
<text x="50" y="68" font-family="'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="30" font-weight="800" fill="#7dd3fc" opacity=".95">08</text>
<text x="112" y="68" font-size="32" font-weight="800" letter-spacing="4" fill="url(#txt)">LET'S CONNECT</text>
<rect x="112" y="78" width="120" height="3" rx="2" fill="url(#bar)"><animate attributeName="width" values="30;300;30" dur="4s" repeatCount="indefinite"/></rect>
<g fill="#fff"><circle cx="950" cy="55" r="4" fill="#818cf8"><animate attributeName="r" values="3;7;3" dur="2s" repeatCount="indefinite"/></circle><circle cx="925" cy="55" r="3" fill="#a78bfa"><animate attributeName="opacity" values=".2;1;.2" dur="2s" begin=".3s" repeatCount="indefinite"/></circle><circle cx="903" cy="55" r="2.5" fill="#7dd3fc"><animate attributeName="opacity" values=".2;1;.2" dur="2s" begin=".6s" repeatCount="indefinite"/></circle></g></svg>