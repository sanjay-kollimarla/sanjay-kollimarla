<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="110" viewBox="0 0 1000 110" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#060914"/><stop offset=".5" stop-color="#0d1330"/><stop offset="1" stop-color="#1a0b2e"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset="1" stop-color="#fff" stop-opacity=".03"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#c4b5fd" stop-opacity=".4"/>
  </linearGradient>
  <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
    <stop offset="0" stop-color="#67e8f9"/><stop offset=".35" stop-color="#a78bfa"/><stop offset=".7" stop-color="#f0abfc"/><stop offset="1" stop-color="#67e8f9"/>
    <animate attributeName="x1" values="0;-1;0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="1;0;1" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
  </linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<rect width="1000" height="110" rx="22" fill="url(#bg)"/>
<g filter="url(#blur)" opacity=".6"><circle r="60" fill="#22d3ee" cx="120" cy="55"><animate attributeName="cx" values="80;400;80" dur="8s" repeatCount="indefinite"/></circle><circle r="70" fill="#c026d3" cx="800" cy="55"><animate attributeName="cx" values="900;560;900" dur="9s" repeatCount="indefinite"/></circle></g>
<rect x="14" y="14" width="972" height="82" rx="20" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.2" filter="url(#shadow)" />
<text x="50" y="68" font-family="'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="30" font-weight="800" fill="#67e8f9" opacity=".95">03</text>
<text x="112" y="68" font-size="32" font-weight="800" letter-spacing="4" fill="url(#txt)">EXPERIENCE</text>
<rect x="112" y="78" width="120" height="3" rx="2" fill="url(#bar)"><animate attributeName="width" values="30;240;30" dur="4s" repeatCount="indefinite"/></rect>
<g fill="#fff"><circle cx="950" cy="55" r="4" fill="#67e8f9"><animate attributeName="r" values="3;7;3" dur="2s" repeatCount="indefinite"/></circle><circle cx="925" cy="55" r="3" fill="#a78bfa"><animate attributeName="opacity" values=".2;1;.2" dur="2s" begin=".3s" repeatCount="indefinite"/></circle><circle cx="903" cy="55" r="2.5" fill="#f0abfc"><animate attributeName="opacity" values=".2;1;.2" dur="2s" begin=".6s" repeatCount="indefinite"/></circle></g></svg>